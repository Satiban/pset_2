services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: kestra
      POSTGRES_USER: kestra
      POSTGRES_PASSWORD: ${KESTRA_DB_PASSWORD}
    volumes:
      - datos_postgres:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestra -d kestra"]
      interval: 10s
      timeout: 5s
      retries: 10

  kestra:
    image: kestra/kestra:v2.0.7
    user: "root"
    command: server standalone
    env_file:
      - .env
    volumes:
      - datos_kestra:/app/storage
      - /var/run/docker.sock:/var/run/docker.sock
      - /tmp/kestra-wd:/tmp/kestra-wd
      - ./data/raw:/data/raw:ro

    environment:
      KESTRA_CONFIGURATION: |
        datasources:
          postgres:
            url: jdbc:postgresql://postgres:5432/kestra
            driverClassName: org.postgresql.Driver
            username: kestra
            password: ${KESTRA_DB_PASSWORD}
        kestra:
          server:
            basic-auth:
              username: ${KESTRA_ADMIN_EMAIL}
              password: ${KESTRA_ADMIN_PASSWORD}
          repository:
            type: postgres
          storage:
            type: local
            local:
              base-path: "/app/storage"
          queue:
            type: postgres
          tasks:
            tmp-dir:
              path: /tmp/kestra-wd/tmp
          url: http://localhost:8080/
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  spark:
    image: apache/spark:3.5.3
    user: "root"
    working_dir: /opt/spark/work-dir
    entrypoint: ["/bin/bash", "-lc"]
    command: ["sleep infinity"]

    env_file:
      - .env

    environment:
      SPARK_LOCAL_IP: 127.0.0.1
      PYSPARK_PYTHON: python3

    volumes:
      - ./spark:/opt/spark/work-dir
      - spark_ivy:/root/.ivy2

    ports:
      - "127.0.0.1:4040:4040"

    restart: unless-stopped

volumes:
  datos_postgres:
  datos_kestra:
  spark_ivy: